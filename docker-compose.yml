services:
  fastlabel-proposal-tool:
    build: .
    image: fastlabel-proposal-tool:latest
    container_name: fastlabel-proposal-tool
    ports:
      - "8501:8501"
    environment:
      # Anthropic API key — set in .env or pass directly
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Mount the FASTLabel document folder into the container.
      # Left side  : path on your Windows PC (edit to match your folder)
      # Right side : path inside the container (keep as-is; matches app default)
      - ${FASTLABEL_DOCS_PATH:-C:/Users/oisok/OneDrive/Desktop/Fastlabel}:/docs/fastlabel:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
