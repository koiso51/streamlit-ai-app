services:
  ai-proposal-tool:
    build: .
    image: ai-proposal-tool:latest
    container_name: ai-proposal-tool
    ports:
      - "8501:8501"
    environment:
      # Anthropic API key — set in .env or pass directly
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REFERENCE_DOCS_PATH=/docs/reference
    volumes:
      # Mount your own reference-materials folder into the container.
      # Left side  : path on your PC (edit to match your folder)
      # Right side : path inside the container (keep as-is; matches app default)
      - ${REFERENCE_DOCS_PATH:-./reference-docs}:/docs/reference:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
